<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>Smile Shield — native demo page</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; background: #f8f9fb; color: #111827;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .wrap { padding: 16px; }
        .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 18px; }
        h1 { margin: 0 0 6px; font-size: 16px; }
        p { margin: 0 0 14px; font-size: 12px; color: #6b7280; line-height: 1.5; }
        .rows { border-top: 1px solid #e5e7eb; padding-top: 10px; font-size: 12px; color: #6b7280; }
        .row { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; }
        .row b { color: #111827; font-weight: 600; text-align: right; overflow-wrap: anywhere; }
        .start {
            width: 100%; margin-top: 14px; padding: 12px 16px; border: 0; border-radius: 10px;
            background: #0b9758; color: #fff; font-size: 14px; font-weight: 600; letter-spacing: .01em;
        }
        .start:disabled { opacity: .6; }
        .status { margin-top: 14px; font-size: 12px; color: #0b9758; }
        .log {
            margin-top: 14px; background: #0b0e13; color: #9ca3af; border-radius: 12px;
            padding: 12px; height: 220px; overflow-y: auto; white-space: pre-wrap; word-break: break-word;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; line-height: 1.55;
        }
        .log .ok { color: #34d399; } .log .err { color: #f87171; }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="card">
            <h1>Shield device check</h1>
            <p>Press Start to run the Shield SDK. Every click re-initialises it, so you can demo the
                flow repeatedly. Every callback is written to the log below and forwarded to the
                Xcode console with a <code>[ShieldDemo]</code> prefix.</p>

            <div class="rows">
                <div class="row"><span>sessionId</span><b id="stSession">—</b></div>
                <div class="row"><span>userId</span><b id="stUser">—</b></div>
                <div class="row"><span>completionSignal</span><b id="stSignal">—</b></div>
                <div class="row"><span>via / duration</span><b id="stVia">—</b></div>
            </div>
            <button id="startBtn" class="start">Start Shield</button>
            <div class="status" id="status"></div>
            <div class="log" id="log"></div>
        </div>
    </div>

    <!-- SIT bundle; switch to the production CDN's /shield/v1/shield.v1.js before release -->
    <script src="https://web.sit.smileapi.net/shield/v1/shield.v1.js"></script>
    <script src="shield-demo.js"></script>
</body>

</html>
